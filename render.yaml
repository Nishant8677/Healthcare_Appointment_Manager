# Render Blueprint: database, API and portals in one file.
#
# One provider rather than two, because the alternative (API on Render, frontend on Vercel)
# means two dashboards, two deploy logs and two places to look when something is wrong — for
# a static site that any host can serve.
#
# Deploying is a two-step process, and it is worth knowing why before you start: the API
# needs the portals' URL for CORS, and the portals need the API's URL to call it. Neither
# exists until Render has created the services. So the first deploy brings both up, and then
# you set those two values and redeploy. Full steps: docs/deployment.md

databases:
  - name: ham-postgres
    databaseName: healthcare
    user: ham
    plan: free

services:
  # ---------------------------------------------------------------- API + workers
  - type: web
    name: ham-api
    runtime: python
    plan: free
    rootDir: backend
    # `uv sync --frozen` installs exactly what uv.lock pins. Without `--frozen` a resolver
    # difference between this machine and the build container could quietly ship different
    # versions than the ones the tests ran against.
    buildCommand: pip install uv && uv sync --frozen
    # Migrations run before the server starts, so a schema change that fails takes the deploy
    # down rather than leaving a running API talking to a database it does not match.
    startCommand: uv run alembic upgrade head && uv run python run.py
    healthCheckPath: /healthz
    envVars:
      - key: APP_ENV
        value: prod
      - key: DATABASE_URL
        fromDatabase:
          name: ham-postgres
          property: connectionString
      # Generated by Render and never seen by anyone, including you. The application refuses
      # to start on a secret shorter than 32 characters.
      - key: JWT_SECRET
        generateValue: true
      - key: LOG_LEVEL
        value: INFO
      # Set after the first deploy, to the portals' URL. Until then the API is reachable but
      # the browser will refuse its responses — which is the correct behaviour, not a fault.
      - key: CORS_ORIGINS
        sync: false
      # The clinic's wall-clock timezone. Working hours are read in this zone; appointments
      # are always stored as UTC instants regardless.
      - key: CLINIC_TIMEZONE
        value: UTC
      # Console by default: a demo deployment that silently mails real addresses because a
      # seeded example.com account happened to be routable is not a risk worth taking.
      - key: EMAIL_PROVIDER
        value: console
      # Stub by default, so the deployment costs nothing and cannot be billed by a crawler.
      # Set LLM_PROVIDER to 'gemini' or 'anthropic' and add LLM_API_KEY for real summaries.
      # Leave LLM_MODEL unset: each provider has its own default.
      - key: LLM_PROVIDER
        value: stub
      - key: BACKGROUND_WORKERS_ENABLED
        value: true

  # ---------------------------------------------------------------- portals
  - type: web
    name: ham-web
    runtime: static
    rootDir: frontend
    # `npm ci` rather than `npm install`: it installs from the lockfile and fails if
    # package.json and the lockfile disagree, which is what you want in a build you are not
    # watching.
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      # Set after the first deploy, to the API's URL, then redeploy — this is read at *build*
      # time and baked into the bundle, so changing it needs a rebuild rather than a restart.
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      # Every path serves index.html so the router can handle it. Without this, refreshing on
      # /admin/doctors asks Render for a file that does not exist and gets a 404 — the classic
      # way a single-page app looks broken only on reload.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
