[project]
name = "healthcare-appointment-manager"
version = "0.1.0"
description = "Healthcare appointment & follow-up manager: booking, AI visit summaries, notifications, calendar sync."
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy[asyncio]",
    "psycopg[binary]",
    "alembic",
    "pydantic-settings",
    "email-validator",
    "pyjwt",
    "argon2-cffi",
    "httpx",
    "anthropic",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "mypy",
    "pre-commit",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "F",     # pyflakes
    "W",     # pycodestyle warnings
    "I",     # import sorting
    "B",     # bugbear
    "UP",    # pyupgrade
    "SIM",   # simplify
    "C4",    # comprehensions
    "ASYNC", # async correctness
    "S",     # bandit security checks
    "RUF",
]
ignore = [
    "B008", # FastAPI's Depends() in defaults is the framework idiom.
]

[tool.ruff.lint.per-file-ignores]
# assert is the point of a test; S105/S106 fire on the deliberately fake fixture credentials.
"tests/*" = ["S101", "S105", "S106"]
"alembic/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.mypy]
python_version = "3.11"
packages = ["app"]
mypy_path = "src"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
